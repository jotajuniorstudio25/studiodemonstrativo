*{
    box-sizing:border-box;
}

body{
    margin:0;
    padding:4px;
    background:transparent;
    font-family:Arial,Helvetica,sans-serif;
    color:#fff;
}

.container{
    width:100%;
    max-width:650px;
    margin:auto;
}


/* ==============================
   CABEÇALHO
============================== */

.header{
    background:#111;
    border:1px solid #f5c400;
    border-radius:10px;
    padding:11px 10px;
    text-align:center;
    margin-bottom:10px;
}

.header h1{
    margin:0;
    color:#f5c400;
    font-size:19px;
}

.header p{
    margin:3px 0 0;
    color:#999;
    font-size:10px;
}


/* ==============================
   CATEGORIAS
============================== */

.category{
    color:#f5c400;
    font-size:13px;
    font-weight:bold;
    margin:12px 2px 6px;
    padding-bottom:4px;
    border-bottom:1px solid #333;
}


/* ==============================
   PLAYER
============================== */

.audio-box{
    background:#111;
    border:1px solid #292929;
    border-radius:8px;
    padding:8px 9px;
    margin-bottom:5px;
    transition:.2s;
}

.audio-box:hover{
    border-color:#555;
}

.audio-box.playing{
    border-color:#f5c400;
    box-shadow:0 0 7px rgba(245,196,0,.15);
}


/* ==============================
   TÍTULO
============================== */

.audio-title{
    font-size:12px;
    font-weight:bold;
    margin-bottom:6px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
}


/* ==============================
   CONTROLES
============================== */

.controls{
    display:flex;
    align-items:center;
    gap:6px;
}


/* ==============================
   PLAY
============================== */

.play{
    width:30px;
    height:30px;
    min-width:30px;

    border:0;
    border-radius:50%;

    background:#f5c400;
    color:#111;

    font-size:12px;
    font-weight:bold;

    cursor:pointer;

    transition:.15s;
}

.play:hover{
    transform:scale(1.06);
}


/* ==============================
   PROGRESSO
============================== */

.progress{
    flex:1;
    height:4px;

    accent-color:#f5c400;

    cursor:pointer;
}


/* ==============================
   TEMPO
============================== */

.time{
    color:#999;
    font-size:9px;
    min-width:68px;
    text-align:right;
}


/* ==============================
   VOLUME
============================== */

.volume{
    width:45px;
    height:4px;

    accent-color:#f5c400;
}


/* ==============================
   CELULAR
============================== */

@media(max-width:500px){

    body{
        padding:3px;
    }

    .header h1{
        font-size:17px;
    }

    .header p{
        font-size:9px;
    }

    .category{
        font-size:12px;
    }

    .audio-title{
        font-size:11px;
    }

    .time{
        min-width:60px;
        font-size:8px;
    }

    .volume{
        width:38px;
    }

}


@media(max-width:360px){

    .volume{
        width:30px;
    }

    .time{
        min-width:55px;
    }

}

</style>

/* =========================================================
   CRIAÇÃO DOS PLAYERS
========================================================= */

const area =
document.getElementById("players");

const players = [];

let categoriaAtual = "";



audios.forEach((item,index)=>{


    /* ==========================
       CRIA CATEGORIA
    ========================== */

    if(item.categoria !== categoriaAtual){

        categoriaAtual =
        item.categoria;

        const categoria =
        document.createElement("div");

        categoria.className =
        "category";

        categoria.textContent =
        categoriaAtual;

        area.appendChild(categoria);
    }



    /* ==========================
       CRIA PLAYER
    ========================== */

    const box =
    document.createElement("div");

    box.className =
    "audio-box";


    box.innerHTML = `

        <div class="audio-title">
            ${item.titulo}
        </div>

        <div class="controls">

            <button
                class="play"
                id="play${index}">
                ▶
            </button>

            <input
                class="progress"
                id="progress${index}"
                type="range"
                min="0"
                max="100"
                value="0">

            <span
                class="time"
                id="time${index}">
                00:00 / 00:00
            </span>

            <input
                class="volume"
                id="volume${index}"
                type="range"
                min="0"
                max="1"
                step="0.01"
                value="1">

        </div>

        <audio
            id="audio${index}"
            src="${GITHUB}${encodeURIComponent(item.arquivo)}"
            preload="metadata">
        </audio>

    `;


    area.appendChild(box);



    /* ==========================
       ELEMENTOS
    ========================== */

    const audio =
    document.getElementById(
        "audio"+index
    );

    const button =
    document.getElementById(
        "play"+index
    );

    const progress =
    document.getElementById(
        "progress"+index
    );

    const time =
    document.getElementById(
        "time"+index
    );

    const volume =
    document.getElementById(
        "volume"+index
    );


    players.push({
        audio:audio,
        button:button,
        box:box
    });



    /* ==========================
       PLAY / PAUSE
    ========================== */

    button.addEventListener(
        "click",
        function(){

            players.forEach(
                function(player,i){

                    if(i !== index){

                        player.audio.pause();

                        player.button.textContent =
                        "▶";

                        player.box.classList.remove(
                            "playing"
                        );

                    }

                }
            );


            if(audio.paused){

                audio.play()
                .then(function(){

                    button.textContent =
                    "❚❚";

                    box.classList.add(
                        "playing"
                    );

                })
                .catch(function(error){

                    console.log(
                        "Erro ao reproduzir:",
                        error
                    );

                });

            }else{

                audio.pause();

                button.textContent =
                "▶";

                box.classList.remove(
                    "playing"
                );

            }

        }
    );



    /* ==========================
       METADADOS
    ========================== */

    audio.addEventListener(
        "loadedmetadata",
        function(){

            time.textContent =
            "00:00 / " +
            formatTime(
                audio.duration
            );

        }
    );



    /* ==========================
       PROGRESSO
    ========================== */

    audio.addEventListener(
        "timeupdate",
        function(){

            if(audio.duration){

                progress.value =
                (
                    audio.currentTime /
                    audio.duration
                ) * 100;

            }


            time.textContent =
            formatTime(
                audio.currentTime
            )
            +
            " / "
            +
            formatTime(
                audio.duration
            );

        }
    );



    /* ==========================
       BARRA DE PROGRESSO
    ========================== */

    progress.addEventListener(
        "input",
        function(){

            if(audio.duration){

                audio.currentTime =
                (
                    progress.value /
                    100
                )
                *
                audio.duration;

            }

        }
    );



    /* ==========================
       VOLUME
    ========================== */

    volume.addEventListener(
        "input",
        function(){

            audio.volume =
            Number(
                volume.value
            );

        }
    );



    /* ==========================
       FINAL DO ÁUDIO
    ========================== */

    audio.addEventListener(
        "ended",
        function(){

            button.textContent =
            "▶";

            progress.value =
            0;

            box.classList.remove(
                "playing"
            );

        }
    );



    /* ==========================
       ERRO DE ARQUIVO
    ========================== */

    audio.addEventListener(
        "error",
        function(){

            console.log(
                "Não foi possível carregar:",
                item.arquivo
            );

        }
    );

});



/* =========================================================
   FORMATA TEMPO
========================================================= */

function formatTime(seconds){

    if(!isFinite(seconds)){

        return "00:00";

    }


    const minutes =
    Math.floor(
        seconds / 60
    );


    const secs =
    Math.floor(
        seconds % 60
    );


    return String(minutes)
    .padStart(2,"0")
    +
    ":"
    +
    String(secs)
    .padStart(2,"0");

}
